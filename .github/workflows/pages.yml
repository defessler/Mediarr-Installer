name: Docs Site

# Builds site/ and publishes it to https://dougfessler.com/projects/mediarr/.
#
# Publishing goes through the publish-project action in defessler/defessler.github.io, which
# copies the built site into projects/mediarr/ on that repo and adds the GA4 tag. It
# authenticates with the write deploy key in this repo's ROOT_SITE_DEPLOY_KEY secret.
# This repo is public, so every job stays on a GitHub-hosted runner.
#
# docs/ in this repo holds development notes, audits and design specs that have no business
# being a public website, so only site/ is built and published. The content lives next to the
# thing it describes and ships from the same commit.
#
# Publishes only from master (a push or a manual run). A pull request gets the build (so a
# broken link or a missing frontmatter title fails review) without publishing, and never
# reaches the deploy-key secret.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let a running publish finish rather than cancelling it mid-push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # build.mjs exits non-zero on an unresolved internal link or a page
      # missing its frontmatter title, so link rot fails CI here instead
      # of shipping a 404 nobody notices.
      - name: Build
        run: npm run build

      - name: Upload site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/_site

  publish:
    name: Publish to dougfessler.com
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish to dougfessler.com/projects/mediarr/
        uses: defessler/defessler.github.io/.github/actions/publish-project@master
        with:
          slug: mediarr
          path: site
          deploy-key: ${{ secrets.ROOT_SITE_DEPLOY_KEY }}
