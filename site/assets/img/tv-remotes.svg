<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Five TV remotes drawn side by side, with the Home button marked in green on each: Roku top right, Fire TV below the ring, Samsung below the ring, LG below the wheel, and on Apple TV the TV button instead">
  <defs>
    <!-- 12 x 11 house glyph, reused for every Home button -->
    <path id="house" d="M6 0 L12 5 L10.5 5 L10.5 11 L7.5 11 L7.5 7 L4.5 7 L4.5 11 L1.5 11 L1.5 5 L0 5 Z"/>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
    .brand { fill: #66D9EF; font-size: 12px; text-anchor: middle; }
    .btnlabel { fill: #A6E22E; font-size: 10px; text-anchor: middle; }
    .body { fill: #2d2d2d; stroke: #49483E; }
    .btn { fill: #3a3a32; }
    .ring { fill: none; stroke: #3a3a32; stroke-width: 12; }
    .home-ring { fill: #141414; stroke: #A6E22E; stroke-width: 1.6; }
  </style>

  <rect width="760" height="300" fill="#141414"/>

  <!-- ── Roku: Home sits top right ── -->
  <text x="84" y="40" class="brand">Roku</text>
  <rect x="30" y="54" width="108" height="200" rx="16" class="body"/>
  <circle cx="58" cy="82" r="10" class="btn"/>
  <circle cx="110" cy="82" r="13" class="home-ring"/>
  <use href="#house" x="103.4" y="76" fill="#A6E22E" transform="translate(0,0)"/>
  <circle cx="84" cy="140" r="30" class="ring"/>
  <circle cx="84" cy="140" r="13" class="btn"/>
  <rect x="52" y="190" width="26" height="11" rx="5.5" class="btn"/>
  <rect x="90" y="190" width="26" height="11" rx="5.5" class="btn"/>
  <rect x="52" y="216" width="26" height="11" rx="5.5" class="btn"/>
  <rect x="90" y="216" width="26" height="11" rx="5.5" class="btn"/>
  <text x="84" y="278" class="btnlabel">Home</text>

  <!-- ── Fire TV: Home below the ring, center ── -->
  <text x="232" y="40" class="brand">Fire TV</text>
  <rect x="178" y="54" width="108" height="200" rx="16" class="body"/>
  <circle cx="232" cy="78" r="8" class="btn"/>
  <circle cx="232" cy="130" r="30" class="ring"/>
  <circle cx="232" cy="130" r="13" class="btn"/>
  <circle cx="204" cy="186" r="10" class="btn"/>
  <circle cx="232" cy="186" r="13" class="home-ring"/>
  <use href="#house" x="225.4" y="180" fill="#A6E22E"/>
  <circle cx="260" cy="186" r="10" class="btn"/>
  <rect x="206" y="222" width="52" height="11" rx="5.5" class="btn"/>
  <text x="232" y="278" class="btnlabel">Home</text>

  <!-- ── Samsung: Home below the ring, center ── -->
  <text x="380" y="40" class="brand">Samsung</text>
  <rect x="326" y="54" width="108" height="200" rx="16" class="body"/>
  <circle cx="352" cy="78" r="8" class="btn"/>
  <circle cx="408" cy="78" r="8" class="btn"/>
  <circle cx="380" cy="134" r="30" class="ring"/>
  <circle cx="380" cy="134" r="13" class="btn"/>
  <circle cx="352" cy="190" r="10" class="btn"/>
  <circle cx="380" cy="190" r="13" class="home-ring"/>
  <use href="#house" x="373.4" y="184" fill="#A6E22E"/>
  <circle cx="408" cy="190" r="10" class="btn"/>
  <rect x="354" y="224" width="52" height="11" rx="5.5" class="btn"/>
  <text x="380" y="278" class="btnlabel">Home</text>

  <!-- ── LG Magic Remote: Home below the wheel ── -->
  <text x="528" y="40" class="brand">LG</text>
  <rect x="474" y="54" width="108" height="200" rx="16" class="body"/>
  <circle cx="500" cy="78" r="8" class="btn"/>
  <circle cx="556" cy="78" r="8" class="btn"/>
  <circle cx="528" cy="136" r="22" class="btn"/>
  <line x1="512" y1="136" x2="544" y2="136" stroke="#2d2d2d" stroke-width="2"/>
  <circle cx="500" cy="192" r="10" class="btn"/>
  <circle cx="528" cy="192" r="13" class="home-ring"/>
  <use href="#house" x="521.4" y="186" fill="#A6E22E"/>
  <circle cx="556" cy="192" r="10" class="btn"/>
  <rect x="502" y="226" width="52" height="11" rx="5.5" class="btn"/>
  <text x="528" y="278" class="btnlabel">Home</text>

  <!-- ── Apple TV: no house. The TV button does the same job. ── -->
  <text x="676" y="40" class="brand">Apple TV</text>
  <rect x="622" y="54" width="108" height="200" rx="16" class="body"/>
  <circle cx="676" cy="116" r="30" class="ring"/>
  <circle cx="676" cy="116" r="13" class="btn"/>
  <circle cx="650" cy="176" r="10" class="btn"/>
  <circle cx="702" cy="176" r="13" class="home-ring"/>
  <rect x="695.5" y="171" width="13" height="9" rx="1.5" fill="none" stroke="#A6E22E" stroke-width="1.4"/>
  <line x1="699" y1="183" x2="705" y2="183" stroke="#A6E22E" stroke-width="1.4"/>
  <circle cx="650" cy="216" r="9" class="btn"/>
  <circle cx="702" cy="216" r="9" class="btn"/>
  <text x="676" y="278" class="btnlabel">TV (same job)</text>
</svg>
